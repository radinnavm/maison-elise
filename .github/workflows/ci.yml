name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend tests are database-free by design (repositories/Prisma are mocked), so
  # CI never needs a real database. These values only satisfy config validation at
  # import time and are intentionally not production credentials.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maison_elise_test
  JWT_SECRET: ci-only-not-a-real-secret

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
